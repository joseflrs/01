name: bpi-r3  images
on:
   workflow_dispatch:
   schedule:
    - cron: '01 08 * * *'
jobs:
    build:
        name: Build BPI-R3 Images
        runs-on: ubuntu-26.04
        steps:
            - name: Setup Ubuntu
              run: |
                sudo apt update
                sudo apt install -y subversion build-essential gettext python3-pyelftools python3-distutils-extra
            - name: Setut Go
              uses: actions/setup-go@main
              with:
                 go-version: '1.27.4'
                 cache: false
            - name: checkout
              uses: actions/checkout@main
            - name: Build
              run: |
                git clone https://github.com/openwrt/openwrt.git
                cp -rf .github/patches/*.patch openwrt/
                cp -rf .github/workflows/r31 openwrt/
                cd openwrt
                wget https://github.com/mj22226/openwrt-arm64/releases/download/filogic-22.1.3/llvm-bpf-22.1.3.Linux-aarch64.tar.zst
                tar -xvf llvm-bpf-22.1.3.Linux-aarch64.tar.zst
                patch -p 1 -i 000.patch
                # patch -p 1 -i kernel.patch
                # patch -p 1 -i mac80211.patch
                # patch -p 1 -i m76.patch
                ./scripts/feeds update -a
                ./scripts/feeds install -a
                cp -rf 01-diskman.patch feeds/luci/
                cp -rf 02-openvpn.patch feeds/luci/
                cp -rf 03-dockerman.patch feeds/luci/
                cp -rf 04-openvpn.patch feeds/packages/
                cp -rf 05-cpu.patch feeds/packages/
                cp -rf 06-lxc.patch feeds/packages/
                cd feeds/luci
                rm -rf applications/luci-app-dockerman
                git apply 01-diskman.patch
                git apply 02-openvpn.patch
                git apply 03-dockerman.patch
                cd -
                cd  feeds/packages
                rm -rf net/openvpn
                git apply 04-openvpn.patch
                git apply 05-cpu.patch
                git apply 06-lxc.patch
                cd -
                sed -i "13s/'1'/'0'/" feeds/packages/utils/dockerd/files/etc/config/dockerd
                sed -i 's/default n/default y/g' feeds/packages/utils/dockerd/Config.in
                sed -i "4s/login/login -f root/" feeds/packages/utils/ttyd/files/ttyd.config
                sed -i '38s/$/ +liburing/' feeds/packages/utils/lvm2/Makefile ; sed -i '111d' feeds/packages/utils/lvm2/Makefile
                sed -i '58s/$/ -std=gnu17/' feeds/packages/net/vsftpd/Makefile
                sed -i '65s/$/ -std=gnu17/' feeds/packages/net/vsftpd/Makefile
                rm -f feeds/packages/libs/libpfring/patches/002-Fix-compilation-on-6.18.57.patch
                ./scripts/feeds update -a
                ./scripts/feeds install -a -f
                mkdir -p files/www/repo
                git apply 11-feeds-bpi3.patch
                git apply 07-key.patch
                mv r31 .config
                echo "# CONFIG_PERSISTENT_HUGE_ZERO_FOLIO is not set" >> target/linux/generic/config-6.18
                echo "# CONFIG_NO_PAGE_MAPCOUNT is not set" >> target/linux/generic/config-6.18
                echo 'CONFIG_GOLANG_EXTERNAL_BOOTSTRAP_ROOT="/opt/hostedtoolcache/go/1.27.4/arm64/bin"' >> .config
                make defconfig
                make download -j32
                make -j$(nproc) 'IGNORE_ERRORS=n m' || true
                tar -czvf bin/targets/mediatek/filogic/packages.tar.gz bin/targets/mediatek/filogic/packages || true
                tar -czvf bin/targets/mediatek/filogic/feeds-packages.tar.gz bin/packages || true
                tar -czvf bin/targets/mediatek/filogic/logs.tar.gz logs
                rm -rf bin/targets/mediatek/filogic/packages || true
                echo "D=$(date +'%Y.%m.%d')" >> $GITHUB_ENV
            - name: Delete tag
              uses: ClementTsang/delete-tag-and-release@v0.4.0
              with:
                delete_release: true
                tag_name: bpi3-x86
              env:
                 GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            - name: Create release
              uses: ncipollo/release-action@main
              with:
                allowUpdates: true
                name: BPI-R3 Images X86 ${{ env.D }}
                tag: bpi3-x86
                replacesArtifacts: true
                draft: true
                token: "${{ secrets.GITHUB_TOKEN }}"
                artifacts: openwrt/bin/targets/mediatek/filogic/*
